<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title desc">
  <title id="title">Milo the owl explorer</title>
  <desc id="desc">A cheerful teal owl wearing a little explorer hat, an orange scarf, and a satchel.</desc>
  <ellipse cx="80" cy="169" rx="46" ry="6" fill="#174943" opacity=".12"/>

  <!-- Feet and satchel sit behind the body. -->
  <path d="M59 150v13m-9-3 9 3 8-2m29-11v13m-9-2 9 2 9-3" fill="none" stroke="#D77A41" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
