<div class="site-shell">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" routerLink="/" aria-label="Đồng Nai ơi, trang chủ"
        ><span class="brand-mark" aria-hidden="true">✦</span><span>Đồng Nai <em>ơi!</em></span></a
      >
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Trang chủ</a
        >
        <a routerLink="/map" routerLinkActive="active">Bản đồ</a>
        <a routerLink="/books" routerLinkActive="active">Tủ sách</a>
        <a routerLink="/panorama" routerLinkActive="active">Góc 360°</a>
        <a routerLink="/questions" routerLinkActive="active">Câu hỏi</a>
        <a routerLink="/games" routerLinkActive="active">Sân chơi</a>
        <a routerLink="/teacher" routerLinkActive="active">Giáo viên</a>
      </nav>
    </div>
  </header>

  <main id="main-content"><router-outlet /></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">Đồng Nai <em>ơi!</em> ✦</span
      ><span>Mỗi vùng đất một câu chuyện hay.</span><a routerLink="/">Về trang chủ ↑</a>
    </div>
  </footer>
</div>

@defer (on idle) {
  @if (showCompanion()) {
    <app-project-companion />
  }
}
