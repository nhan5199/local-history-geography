<div class="site-shell">
  <a class="skip-link" href="#main-content">Đến nội dung chính</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" routerLink="/" aria-label="Đồng Nai ơi, trang chủ"
        ><span class="brand-mark" aria-hidden="true">✦</span><span>Đồng Nai <em>ơi!</em></span></a
      >
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          ><span class="nav-icon" aria-hidden="true">⌂</span>Trang chủ</a
        >
        <a routerLink="/lessons" routerLinkActive="active" ariaCurrentWhenActive="page"><span class="nav-icon" aria-hidden="true">▤</span>Bài học</a>
        <a routerLink="/map" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">⌖</span>Bản đồ</a>
        <a routerLink="/books" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">▥</span>Tủ sách</a>
        <a routerLink="/panorama" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">◉</span>Góc 360°</a>
        <a routerLink="/questions" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">?</span>Câu hỏi</a>
        <a routerLink="/games" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">★</span>Sân chơi</a>
        <a routerLink="/teacher" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">✎</span>Giáo viên</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1"><router-outlet /></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">Đồng Nai <em>ơi!</em> ✦</span
      ><span>Mỗi vùng đất một câu chuyện hay.</span><a routerLink="/">Về trang chủ ↑</a>
    </div>
  </footer>
</div>

@defer (on idle) {
  @if (showCompanion()) {
    <app-project-companion />
  }
}
