<nav
  class="floating-menu"
  [class.expanded]="expanded()"
  aria-label="Điều hướng bản đồ"
  (keydown.escape)="onEscape($event)"
>
  <div class="menu-heading">
    <button
      #toggleButton
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="expanded()"
      aria-controls="map-menu-items"
      [attr.aria-label]="expanded() ? 'Thu gọn menu' : 'Mở menu'"
      [title]="expanded() ? 'Thu gọn menu' : 'Mở menu'"
      (click)="toggle()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="4" />
        <path d="M9 4v16m7-11-3 3 3 3" />
      </svg>
    </button>
    <span class="menu-label menu-brand" [attr.aria-hidden]="!expanded()"
      >OUR PLACE<span>Đồng Nai</span></span
    >
  </div>
  <div id="map-menu-items" class="menu-items">
    <button
      type="button"
      class="menu-item active"
      aria-label="Khám phá bản đồ"
      title="Khám phá bản đồ"
      aria-current="page"
      (click)="choose('map')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6zm6-3v15m6-12v15" />
      </svg>
      <span class="menu-label" [attr.aria-hidden]="!expanded()">Khám phá bản đồ</span>
    </button>
    <a class="menu-item" routerLink="/" aria-label="Thư viện bài học" title="Thư viện bài học">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5C8 2 4 3 3 4v15c3-2 6-2 9 0 3-2 6-2 9 0V4c-3-2-6-2-9 1zm0 0v14" />
      </svg>
      <span class="menu-label" [attr.aria-hidden]="!expanded()">Thư viện bài học</span>
    </a>
    <div class="menu-divider"></div>
  </div>
</nav>
